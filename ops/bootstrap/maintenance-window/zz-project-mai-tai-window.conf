# needrestart config; the helper uses an explicit ET clock, not caller TZ.
if (system('/usr/local/libexec/project-mai-tai-maintenance', 'window') != 0) {
    $nrconf{restart} = 'l';
    $ENV{NEEDRESTART_MODE} = 'l';
    $nrconf{override_rc}{qr(^project-mai-tai-)} = 0;
    $nrconf{override_rc}{qr(^redis(?:[-@.]|$))} = 0;
    $nrconf{override_rc}{qr(^postgresql(?:[-@.]|$))} = 0;
}
