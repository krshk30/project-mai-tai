// Dedicated WEEKMAINT1 APT_CONFIG; use only with the reviewed root-private manifest.
// Do not inherit a later generic upgrade origin or a restart/reboot policy.
Dir::Etc::main "/dev/null";
Dir::Etc::parts "/var/lib/project-mai-tai-weekmaint/empty-apt-parts";
#include "/var/lib/project-mai-tai-weekmaint/preserved-blacklists.conf";
#clear Unattended-Upgrade::Allowed-Origins;
#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
    "origin=Ubuntu,archive=${distro_codename}-security";
};
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::InstallOnShutdown "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "false";
Unattended-Upgrade::Package-Blacklist {
    "^redis";
    "^postgresql";
    "^project-mai-tai";
};
DPkg::Pre-Invoke { "/usr/local/libexec/project-mai-tai-maintenance install"; };
DPkg::Post-Invoke { "/usr/local/libexec/project-mai-tai-maintenance audit"; };
DPkg::Options { "--force-confdef"; "--force-confold"; };
