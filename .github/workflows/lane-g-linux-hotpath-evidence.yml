name: Lane G Isolated Linux Hotpath Evidence

on:
  push:
    branches:
      - codex/mirrorholdg-linux-hotpath-evidence-1008

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 06336beb2340c6334ff4e6b0d64b23c1c2b96215
          path: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 27b3244364aa011eb8fd9b7991407f94894a66ac
          path: head
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
      - name: Install the same test dependency environment
        run: python -m pip install -e "./main[dev]" pytest==8.4.2
      - name: Unchanged RESERVE1 test, twenty fresh processes per exact checkout
        run: |
          mkdir -p evidence-output
          python - <<'PY' | tee evidence-output/reserve1-paired.txt
          import os
          import subprocess
          import sys
          from pathlib import Path

          failures = {"main": 0, "head": 0}
          target = "tests/unit/test_reserve1.py::test_armed_hard_stop_and_managed_flip_share_one_episode_sell_claim"
          for turn in range(20):
              for label in ("main", "head"):
                  root = Path(label).resolve()
                  env = dict(os.environ, PYTHONPATH=str(root / "src"))
                  result = subprocess.run(
                      [sys.executable, "-m", "pytest", "-q", target, "--durations=1"],
                      cwd=root, env=env, text=True, capture_output=True, timeout=90,
                  )
                  print(f"{label} run={turn + 1} rc={result.returncode}", flush=True)
                  print(result.stdout, result.stderr, flush=True)
                  failures[label] += int(result.returncode != 0)
          print(f"RESULT failures={failures} runs_per_head=20", flush=True)
          sys.exit(bool(sum(failures.values())))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-g-reserve1-paired
          path: evidence-output/
          retention-days: 14
