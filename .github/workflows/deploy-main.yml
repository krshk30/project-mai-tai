name: DISABLED - Deploy Main (use Deploy Service)

on:
  workflow_dispatch:

permissions:
  contents: read

# Deploy Main used to update the checkout, install dependencies, and run migrations before its
# health gate. A red run therefore did not mean "nothing changed". Keep the manual entry visible
# so an attempted use leaves an auditable failed run, but do not give this workflow any path to the
# production host. Narrow releases belong in deploy-service.yml.
jobs:
  refused:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the prohibited full-fleet deploy
        run: |
          echo "::error::Deploy Main is prohibited because it can mutate production before reporting failure. Use Deploy Service with the narrowest service target."
          exit 1
