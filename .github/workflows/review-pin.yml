name: Independent Review Pin

on:
  pull_request_target:
    # Commit the independent pin before adding/re-adding the review-pinned label.
    # A new head needs a new pin and label event; required checks remain pending.
    # Labels trigger verification but never substitute for committed coverage.
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: review-pin-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-review-pin:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target deliberately runs the trusted gate from main. The
      # untrusted PR is fetched only as Git data and is never executed.
      - name: Check out trusted gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch exact pull-request head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/review-pin/pr-head"
          actual="$(git rev-parse refs/review-pin/pr-head)"
          test "$actual" = "$EXPECTED_HEAD" || {
            echo "COULD_NOT_TELL: fetched head $actual differs from event head $EXPECTED_HEAD" >&2
            exit 3
          }

      - name: Check out committed review ledger
        uses: actions/checkout@v4
        with:
          ref: review-pins
          path: review-pin-ledger
          fetch-depth: 0

      # Operator 10-31: a PR whose every changed path is under docs/ needs no
      # independent pin. Paths are read from the fetched head as data only.
      - name: Detect docs-only pull request
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA" refs/review-pin/pr-head)"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^docs/'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "DOCS_ONLY: every changed path is under docs/ -> no independent pin required"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require complete independent review coverage
        if: steps.scope.outputs.docs_only != 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/review_pin_gate.py verify \
            --repo . \
            --ledger review-pin-ledger \
            --pr "$PR_NUMBER" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
