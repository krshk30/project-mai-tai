name: F I Alternating Strict PostgreSQL Latency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alternating-strict:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        order: ["fi", "if"]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_mai_tai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d project_mai_tai_test"
          --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      MAI_TAI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
      F_HEAD: ce4d98140bca2ce5975921a6b54ef8e462c30ba5
      I_HEAD: 762a1d5d8e561484f43eb6fd252f79dc1953edff
      PAIR_ORDER: ${{ matrix.order }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze identical OMS sources and unchanged harness
        id: freeze
        run: |
          git fetch origin "$F_HEAD" "$I_HEAD"
          git diff --exit-code "$F_HEAD" "$I_HEAD" -- src/project_mai_tai/oms src/project_mai_tai/db src/project_mai_tai/broker_adapters tests/integration/test_buy_submission_tokens_runtime.py
          mkdir -p "$RUNNER_TEMP/f-final" "$RUNNER_TEMP/i-final" final-pair-logs
          git archive "$F_HEAD" | tar -x -C "$RUNNER_TEMP/f-final"
          git archive "$I_HEAD" | tar -x -C "$RUNNER_TEMP/i-final"
          printf 'F=%s\nI=%s\nrunner=%s\norder=%s\nrounds=3\nno added warm-up; canonical harness unchanged\n' "$F_HEAD" "$I_HEAD" "$RUNNER_NAME" "$PAIR_ORDER" | tee final-pair-logs/identity.log
      - name: Install identical dependencies
        id: dependencies
        run: python -m pip install -e "$RUNNER_TEMP/i-final[dev]"
      - name: Same PostgreSQL scalar and canonical DAY controls
        working-directory: ${{ runner.temp }}/i-final
        env:
          PYTHONPATH: ${{ runner.temp }}/i-final:${{ runner.temp }}/i-final/src
        run: python -m pytest -p no:cacheprovider -q tests/integration/test_intent_order_scalar_reads_postgres.py tests/integration/test_clearwait1_day_nonworking_postgres.py
      - name: Same twenty duplicate-quote controls per source
        run: |
          python - <<'PY'
          import os, subprocess
          failures = {}
          node = "tests/unit/test_nfq2_tick_path.py::test_nfq2_slow_save_does_not_stall_loop_and_concurrent_quotes_queue_once"
          for lane in ("f", "i"):
              root = os.path.join(os.environ["RUNNER_TEMP"], lane + "-final")
              env = dict(os.environ, PYTHONPATH=root + ":" + root + "/src:" + os.environ["GITHUB_WORKSPACE"] + "/tests/support")
              failures[lane] = 0
              for run in range(20):
                  result = subprocess.run(["python", "-m", "pytest", "-p", "no:cacheprovider", "-q", node],
                                          cwd=root, env=env, capture_output=True, text=True)
                  failures[lane] += result.returncode != 0
                  with open(f"final-pair-logs/{lane}-duplicate-{run:02d}.log", "w") as log:
                      log.write(result.stdout + result.stderr)
              print(lane, "strict duplicate timing failures", failures[lane], "of20", flush=True)
          assert not any(failures.values()), failures
          PY
      - name: Three alternating strict pairs, retain every position
        id: pairs
        if: ${{ !cancelled() && steps.freeze.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          results = []
          node = "tests/integration/test_buy_submission_tokens_runtime.py::test_actual_oms_240_events_per_second_concurrent_buys_and_30_second_read"
          for repeat in range(1, 4):
              for position, lane in enumerate(os.environ["PAIR_ORDER"], 1):
                  root = os.path.join(os.environ["RUNNER_TEMP"], lane + "-final")
                  env = dict(os.environ, PYTHONPATH=root + ":" + root + "/src:" + os.environ["GITHUB_WORKSPACE"] + "/tests/support")
                  result = subprocess.run(["python", "-m", "pytest", "-p", "no:cacheprovider", "-s", node],
                                          cwd=root, env=env, capture_output=True, text=True)
                  output = result.stdout + result.stderr
                  Path(f"final-pair-logs/round-{repeat}-position-{position}-{lane}.log").write_text(output)
                  metric = next((line for line in output.splitlines() if "[CANCEL-TOKEN-PG-LATENCY]" in line), "UNMEASURED")
                  values = dict(re.findall(r"(loop_stall_ms|protective_close_max_ms)=([0-9.]+)", metric))
                  row = dict(round=repeat, position=position, lane=lane, returncode=result.returncode,
                             head=os.environ[lane.upper() + "_HEAD"], metric=metric, **values)
                  results.append(row)
                  print(json.dumps(row), flush=True)
                  Path("final-pair-logs/results.json").write_text(json.dumps(results, indent=2) + "\n")
          summary = "| Round | Position | Lane | Loop stall ms | Close ms | Result |\n|---|---|---|---|---|---|\n"
          for row in results:
              summary += f"| {row['round']} | {row['position']} | {row['lane'].upper()} | {row.get('loop_stall_ms', 'UNMEASURED')} | {row.get('protective_close_max_ms', 'UNMEASURED')} | {'PASS' if row['returncode'] == 0 else 'FAIL'} |\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write(summary)
          assert all(row["returncode"] == 0 for row in results), results
          PY
      - name: Preserve identities and every receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternating-strict-${{ github.run_id }}-${{ matrix.order }}
          path: final-pair-logs
      - name: Require all strict passes
        if: always()
        env:
          PAIRS_OUTCOME: ${{ steps.pairs.outcome }}
        run: test "$PAIRS_OUTCOME" = success
