name: Closed Owner Main F I GC Assessment

on:
  workflow_dispatch:
    inputs:
      f_head:
        description: Exact F source commit
        required: true
        type: string
      i_head:
        description: Exact I source commit
        required: true
        type: string
  push:
    branches: ["codex/flye-bound-owner-target-close-1008"]
    paths: [".github/workflows/closed-owner-gc-assessment.yml"]

permissions:
  contents: read

jobs:
  same-runner-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_mai_tai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d project_mai_tai_test"
          --health-interval 2s --health-timeout 5s --health-retries 10
    env:
      MAI_TAI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
      MAIN_HEAD: d451edf80fbe752794988bd6fc8a368d62032267
      F_HEAD: ${{ inputs.f_head || '88ac2f631f54e7ad903d2a5ae9d7380df0fc7b80' }}
      I_HEAD: ${{ inputs.i_head || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze unchanged source trees
        run: |
          git fetch origin "$MAIN_HEAD" "$F_HEAD" "$I_HEAD"
          mkdir -p assessment-logs
          for lane in MAIN F I; do
            key="${lane}_HEAD"
            sha="${!key}"
            git cat-file -e "$sha^{commit}"
            mkdir -p "$RUNNER_TEMP/$lane-assessment"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/$lane-assessment"
            printf '%s=%s\n' "$lane" "$sha" >> assessment-logs/identity.log
          done
      - name: Install common dependencies
        run: python -m pip install -e "$RUNNER_TEMP/I-assessment[dev]"
      - name: Six matched core-workload and two allocation runs
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          script = pathlib.Path("tests/support/closed_owner_pg_workload_assessment.py").resolve()
          failures = {}
          for tracing in (False, True):
              for lane in ("MAIN", "F", "I"):
                  if tracing and lane == "F":
                      continue
                  for policy in (("normal",) if tracing else ("normal", "freeze")):
                      label = f"{lane}-{policy}-trace{int(tracing)}"
                      root = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"{lane}-assessment"
                      env = dict(os.environ, PYTHONPATH=str(root / "src") + ":" + str(root),
                                 SOURCE_SHA=os.environ[lane + "_HEAD"], GC_POLICY=policy,
                                 ALLOCATION_TRACE=str(int(tracing)))
                      with open(f"assessment-logs/{label}.log", "w") as log:
                          result = subprocess.run(["python", str(script)], cwd=root, env=env,
                                                  stdout=log, stderr=subprocess.STDOUT, timeout=150)
                      failures[label] = result.returncode
                      print(label, "exit", result.returncode, flush=True)
                      for line in pathlib.Path(f"assessment-logs/{label}.log").read_text().splitlines():
                          if line.startswith("[PG-GC-ASSESSMENT]"):
                              print(line, flush=True)
          pathlib.Path("assessment-logs/outcomes.txt").write_text(str(failures))
          assert not any(failures.values()), failures
          PY
      - name: Preserve every result including failed baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closed-owner-gc-assessment-${{ github.run_id }}
          path: assessment-logs
