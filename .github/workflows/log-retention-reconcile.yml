name: Reconcile Log Retention

on:
  schedule:
    # 17:30 EST / 18:30 EDT: after the 16:00 ET market close year-round.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-mai-tai-log-retention-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require main and an after-hours window
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Log retention reconciliation must run from main."
            exit 1
          fi

          eastern_hour=$((10#$(TZ=America/New_York date +%H)))
          eastern_weekday=$((10#$(TZ=America/New_York date +%u)))
          if [ "$eastern_weekday" -le 5 ] && [ "$eastern_hour" -ge 7 ] && [ "$eastern_hour" -lt 16 ]; then
            echo "Refusing log retention reconciliation during the weekday 07:00-16:00 ET market window."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check production SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Missing deploy secrets: VPS_HOST and VPS_USER are required."
            exit 1
          fi
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_SSH_KEY_BASE64" ]; then
            echo "Missing deploy secret: add VPS_SSH_KEY or VPS_SSH_KEY_BASE64."
            exit 1
          fi

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "$VPS_SSH_KEY_BASE64" ]; then
            printf '%s' "$VPS_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/project_mai_tai_vps
          else
            printf '%b' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/project_mai_tai_vps
          fi
          chmod 600 ~/.ssh/project_mai_tai_vps
          ssh-keygen -y -f ~/.ssh/project_mai_tai_vps >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Reconcile the versioned logrotate policy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          key=~/.ssh/project_mai_tai_vps
          remote_dir=$(ssh -i "$key" "$remote" 'mktemp -d /tmp/project-mai-tai-logrotate.XXXXXX')
          case "$remote_dir" in
            /tmp/project-mai-tai-logrotate.*) ;;
            *) echo "Unexpected remote temporary directory: $remote_dir"; exit 1 ;;
          esac

          cleanup() {
            ssh -i "$key" "$remote" "rm -rf -- '$remote_dir'"
          }
          trap cleanup EXIT

          ssh -i "$key" "$remote" "mkdir -p '$remote_dir/ops/logrotate'"
          scp -i "$key" \
            ops/logrotate/install.sh \
            ops/logrotate/project-mai-tai \
            "$remote:$remote_dir/ops/logrotate/"
          ssh -i "$key" "$remote" \
            "bash '$remote_dir/ops/logrotate/install.sh' '$remote_dir'"

      - name: Alert when reconciliation fails
        if: ${{ failure() }}
        env:
          NTFY_URL: https://ntfy.sh/mai-tai-preopen-28806a5a97b7
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="Log retention reconciliation failed. No application service was restarted. Run: ${RUN_URL}"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H "Title: RED mai-tai log retention reconcile failed" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            --data "$body" \
            "$NTFY_URL"
