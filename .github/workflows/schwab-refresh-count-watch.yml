name: Schwab Refresh Count Watch

on:
  schedule:
    # 01:15 EST / 02:15 EDT. The script grades the previous complete ET day.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Eastern calendar day to re-check (YYYY-MM-DD); blank means yesterday ET"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: project-mai-tai-schwab-refresh-count-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require main
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Schwab refresh-count watch must run from main."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check production SSH secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "Missing VPS_HOST or VPS_USER."
            exit 1
          fi
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_SSH_KEY_BASE64" ]; then
            echo "Missing VPS_SSH_KEY or VPS_SSH_KEY_BASE64."
            exit 1
          fi

      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_BASE64: ${{ secrets.VPS_SSH_KEY_BASE64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "$VPS_SSH_KEY_BASE64" ]; then
            printf '%s' "$VPS_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/project_mai_tai_vps
          else
            printf '%b' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/project_mai_tai_vps
          fi
          chmod 600 ~/.ssh/project_mai_tai_vps
          ssh-keygen -y -f ~/.ssh/project_mai_tai_vps >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Grade the previous complete ET day
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REQUESTED_DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          remote="${VPS_USER}@${VPS_HOST}"
          key=~/.ssh/project_mai_tai_vps
          remote_dir=$(ssh -i "$key" "$remote" 'mktemp -d /tmp/project-mai-tai-refresh-watch.XXXXXX')
          case "$remote_dir" in
            /tmp/project-mai-tai-refresh-watch.*) ;;
            *) echo "Unexpected remote temporary directory: $remote_dir"; exit 1 ;;
          esac

          cleanup() {
            ssh -i "$key" "$remote" "rm -rf -- '$remote_dir'"
          }
          trap cleanup EXIT

          scp -i "$key" ops/health/schwab_refresh_count_check.py "$remote:$remote_dir/"
          day_args=()
          if [ -n "$REQUESTED_DAY" ]; then
            case "$REQUESTED_DAY" in
              ????-??-??) day_args=(--day "$REQUESTED_DAY") ;;
              *) echo "day must be YYYY-MM-DD"; exit 2 ;;
            esac
          fi
          quoted_day_args=""
          if [ ${#day_args[@]} -gt 0 ]; then
            printf -v quoted_day_args ' --day %q' "${day_args[1]}"
          fi
          ssh -i "$key" "$remote" \
            "sudo python3 '$remote_dir/schwab_refresh_count_check.py'$quoted_day_args" \
            | tee "$RUNNER_TEMP/schwab-refresh-count.txt"

      - name: Alert when refresh cadence is unhealthy or unreadable
        if: ${{ failure() }}
        env:
          NTFY_URL: https://ntfy.sh/mai-tai-preopen-28806a5a97b7
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          verdict=$(grep '^VERDICT:' "$RUNNER_TEMP/schwab-refresh-count.txt" 2>/dev/null | tail -1 || true)
          body="${verdict:-VERDICT: COULD_NOT_TELL workflow failed before the check produced a verdict}. No application service was restarted. Run: ${RUN_URL}"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -H "Title: RED Schwab refresh count watch" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            --data "$body" \
            "$NTFY_URL"
