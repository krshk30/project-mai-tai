name: Validate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start runner PostgreSQL 16
        run: |
          test -x /usr/lib/postgresql/16/bin/postgres
          sudo systemctl start postgresql.service
          for attempt in {1..10}; do
            if /usr/lib/postgresql/16/bin/pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres -t 5; then
              break
            fi
            sleep 2
          done
          /usr/lib/postgresql/16/bin/pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres -t 5
          server_version="$(sudo -u postgres /usr/lib/postgresql/16/bin/psql -X -At -p 5432 -d postgres -v ON_ERROR_STOP=1 -c 'SHOW server_version_num')"
          test "$((server_version / 10000))" -eq 16
          sudo -u postgres /usr/lib/postgresql/16/bin/psql -X -p 5432 -d postgres -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres'"
          sudo -u postgres /usr/lib/postgresql/16/bin/createdb -p 5432 --owner=postgres project_mai_tai_test
          PGPASSWORD=postgres /usr/lib/postgresql/16/bin/psql -X -h 127.0.0.1 -p 5432 -U postgres -d project_mai_tai_test -v ON_ERROR_STOP=1 -c 'SELECT 1'

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Migrate test database
        env:
          MAI_TAI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
        run: |
          alembic upgrade head

      - name: Check log marker isolation
        run: python ops/health/check_log_marker_collisions.py

      - name: Run unit tests
        env:
          KILLSW1_TEST_PG_DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
        run: python -m pytest -p no:cacheprovider tests/unit -m "not timing"

      - name: Run timing gates in a fresh process
        env:
          KILLSW1_TEST_PG_DSN: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
        # Preserve every gate and budget; isolate it from the full unit-suite heap.
        # This exact node remains mandatory only in the quiet pre-install speed gate.
        run: python -m pytest -p no:cacheprovider tests/unit -m timing --deselect=tests/unit/test_momlatch1_gateway_integration.py::test_gateway_A_240_per_second_60s_original_budget_and_TQ_progress

      - name: Run integration, replay, and backtest golden gate
        env:
          MAI_TAI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
        run: python -m pytest -p no:cacheprovider tests/integration tests/replay tests/backtest

      - name: Run Ruff
        run: python -m ruff check src tests
