name: Validate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_mai_tai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_mai_tai_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install PostgreSQL client and migrate test database
        env:
          MAI_TAI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          alembic upgrade head

      - name: Check log marker isolation
        run: python ops/health/check_log_marker_collisions.py

      - name: Run unit tests
        run: python -m pytest -p no:cacheprovider tests/unit

      - name: Run integration, replay, and backtest golden gate
        env:
          MAI_TAI_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/project_mai_tai_test
        run: python -m pytest -p no:cacheprovider tests/integration tests/replay tests/backtest

      - name: Run Ruff
        run: python -m ruff check src tests
